name: Update RAP guidance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mbcp_guidance/**"
      - "scripts/**"
      - "config/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/update_guidance.yml"
  schedule:
    # GitHub frequently delays or drops very high-frequency scheduled events.
    # Start two watcher runs per hour; each one checks RAP availability every
    # two minutes for up to 24 minutes.
    - cron: "7,37 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-guidance:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out latest main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev libgeos-dev proj-bin

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify scientific fidelity
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p "test_*.py" -v

      - name: Watch for a newer RAP cycle
        id: rap_watch
        if: github.event_name == 'schedule'
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_FULL_NAME: ${{ github.repository }}
        run: |
          repo_name="${REPOSITORY_FULL_NAME#*/}"
          published_url="https://${REPOSITORY_OWNER}.github.io/${repo_name}/data/latest.json"

          set +e
          PYTHONPATH=. python scripts/wait_for_new_rap.py \
            --published-url "$published_url" \
            --poll-seconds 120 \
            --max-wait-minutes 24 \
            --cache-dir cache
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "new_cycle=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 3 ]; then
            echo "new_cycle=false" >> "$GITHUB_OUTPUT"
            echo "No newer RAP cycle appeared during this watcher window."
          else
            exit "$status"
          fi

      - name: Generate latest RAP guidance
        id: guidance
        if: github.event_name != 'schedule' || steps.rap_watch.outputs.new_cycle == 'true'
        continue-on-error: true
        run: |
          PYTHONPATH=. python scripts/run_guidance.py \
            --output-dir web/data \
            --asset-dir web/assets \
            --fail-on-error

      - name: Upload RAP error log
        if: steps.guidance.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rap-guidance-error
          path: web/data/guidance_error.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Configure Pages
        if: always() && steps.guidance.outcome != 'skipped'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: always() && steps.guidance.outcome != 'skipped'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        if: always() && steps.guidance.outcome != 'skipped'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Mark failed guidance generation
        if: steps.guidance.outcome == 'failure'
        run: |
          echo "RAP guidance generation failed. See the rap-guidance-error artifact and web/data/guidance_error.txt."
          exit 1
